<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,follow">
    <title>页面未找到 | 甘肃骐霖智能装备</title>
    <link rel="stylesheet" href="/styles/main.css">
    <style>
        .error-page{min-height:100vh;display:grid;place-items:center;padding:40px 20px;background:linear-gradient(135deg,#f4f8fb,#eaf2f7)}
        .error-card{max-width:720px;padding:56px 42px;text-align:center;background:#fff;border-radius:24px;box-shadow:0 20px 60px rgba(18,54,75,.12)}
        .error-code{margin:0;color:#13718c;font-size:clamp(72px,18vw,144px);line-height:.9;font-weight:800}
        .error-card h1{margin:22px 0 12px;color:#173445;font-size:clamp(28px,5vw,42px)}
        .error-card p{margin:0 auto 28px;max-width:540px;color:#607480;line-height:1.8}
        .error-links{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
        .error-links a{padding:12px 20px;border-radius:999px;background:#13718c;color:#fff;text-decoration:none;font-weight:700}
        .error-links a:not(:first-child){background:#eef5f7;color:#173445}
    </style>
</head>
<body>
<main class="error-page">
    <section class="error-card" aria-labelledby="error-title">
        <p class="error-code" aria-hidden="true">404</p>
        <h1 id="error-title">页面未找到</h1>
        <p>您访问的页面可能已移动或地址有误。请选择网站语言返回首页，或通过首页联系我们获取产品与项目支持。</p>
        <nav class="error-links" aria-label="返回首页">
            <a href="/index.php">中文首页</a>
            <a href="/en/index.html" lang="en">English</a>
            <a href="/ru/index.html" lang="ru">Русский</a>

</body>
</html>
